[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iamcheck"
version = "0.1.0"
description = "Scan AWS and GCP IAM for overpermissive roles and output a prioritised risk report."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["aws", "gcp", "iam", "security", "cloud", "devsecops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "boto3>=1.34",
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.6",
]

[project.scripts]
iamcheck = "iamcheck.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[iam]>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "boto3-stubs[iam]>=1.34",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
